# Builds the Windows installer (NSIS x64) for the kiosk client.
# Run manually from the Actions tab (artifact), or push a tag like desktop-v1.0.0 (artifact + GitHub Release with the .exe).
name: Desktop Windows installer

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Server URL prefilled in the client's Settings
        default: https://digitalfix.cloud/mirage-manage
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary (npm allowScripts)
        run: node node_modules/electron/install.js

      - name: Typecheck desktop
        run: npm run typecheck -w @grm/desktop

      - name: Build installer
        run: npm run dist:win -w @grm/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MAIN_VITE_DEFAULT_API_URL: ${{ inputs.api_url || 'https://digitalfix.cloud/mirage-manage' }}

      - uses: actions/upload-artifact@v4
        with:
          name: game-room-client-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
