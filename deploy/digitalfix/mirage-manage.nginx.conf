# mirage-manage - node (game room manager: Next.js 16 web with basePath=/mirage-manage + NestJS API)
# github.com/gegagagua/gameroom-manage  ->  pm2: mirage-manage-web (127.0.0.1:3104), mirage-manage-api (127.0.0.1:4104)
#
# /mirage-manage/api/* goes straight to NestJS (its global prefix is /api, so the
# /mirage-manage part is stripped). Desktop kiosk clients use apiUrl=https://digitalfix.cloud/mirage-manage.
# Everything else is proxied bare to Next (built with basePath, expects the prefix).
location ^~ /mirage-manage/api/ {
    proxy_pass http://127.0.0.1:4104/api/;
    include /etc/nginx/digitalfix/proxy.conf;
    client_max_body_size 5m;
}
location = /mirage-manage {
    proxy_pass http://127.0.0.1:3104;
    include /etc/nginx/digitalfix/proxy.conf;
}
location ^~ /mirage-manage/ {
    proxy_pass http://127.0.0.1:3104;
    include /etc/nginx/digitalfix/proxy.conf;
}
